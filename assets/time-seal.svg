<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" role="img" aria-labelledby="title desc">
  <title id="title">Animated time seal</title>
  <desc id="desc">A minimal indigo clock seal with a slowly moving hand and orbiting stars.</desc>

  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#8b89c8" stop-opacity=".28" />
      <stop offset="1" stop-color="#8b89c8" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <g transform="translate(360 32)">
    <circle r="28" fill="url(#halo)" filter="url(#blur)">
      <animate attributeName="r" values="24;30;24" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values=".45;.9;.45" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="19" fill="#171725" fill-opacity=".92" stroke="#8b89c8" stroke-opacity=".75" />
    <circle r="15" fill="none" stroke="#d6d5ff" stroke-opacity=".22" />

    <g stroke="#d6d5ff" stroke-linecap="round">
      <path d="M0-18v4M0 14v4M-18 0h4M14 0h4" stroke-width="1.5" stroke-opacity=".7" />
      <path d="M0 0V-10M0 0L7 6" stroke-width="2" />
      <circle r="2" fill="#d6d5ff" stroke="none" />
      <g>
        <circle cx="0" cy="-25" r="2" fill="#d6d5ff" stroke="none">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite" />
        </circle>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </g>

    <g fill="#d6d5ff">
      <path d="M0-26l1.3 3.1L4.5-22l-3.2 1.3L0-17.5l-1.3-3.2L-4.5-22l3.2-1.3z" opacity=".7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".35;.9;.35" dur="3s" repeatCount="indefinite" />
      </path>
      <circle cx="0" cy="-30" r="1.1" opacity=".55">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".2;.75;.2" dur="4s" repeatCount="indefinite" begin=".8s" />
      </circle>
      <path d="M0-23l.9 2.1 2.1.9-2.1.9L0-17l-.9-2.1-2.1-.9 2.1-.9z" opacity=".45">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".18;.65;.18" dur="5s" repeatCount="indefinite" begin="1.4s" />
      </path>
    </g>
  </g>
</svg>
